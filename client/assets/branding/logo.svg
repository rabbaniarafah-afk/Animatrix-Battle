<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#1a2230"/>
      <stop offset="100%" stop-color="#05070a"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Badge background -->
  <rect x="6" y="6" width="288" height="288" rx="42" fill="url(#bg)"/>
  <rect x="6" y="6" width="288" height="288" rx="42" fill="none" stroke="#f4d232" stroke-width="6"/>
  <rect x="18" y="18" width="264" height="264" rx="34" fill="none" stroke="#f4d232" stroke-width="1.5" opacity="0.35"/>

  <!-- Speed streaks -->
  <line x1="18" y1="90" x2="70" y2="90" stroke="#55b8f6" stroke-width="5" opacity="0.55" stroke-linecap="round"/>
  <line x1="18" y1="110" x2="55" y2="110" stroke="#911df5" stroke-width="5" opacity="0.45" stroke-linecap="round"/>

  <!-- Stickman: mid-punch pose, matches the in-game rig style -->
  <g filter="url(#glow)">
    <!-- back leg -->
    <line x1="150" y1="185" x2="120" y2="215" stroke="#f4d232" stroke-width="15" stroke-linecap="round"/>
    <line x1="120" y1="215" x2="128" y2="252" stroke="#f4d232" stroke-width="15" stroke-linecap="round"/>
    <!-- front leg -->
    <line x1="150" y1="185" x2="172" y2="218" stroke="#f4d232" stroke-width="15" stroke-linecap="round"/>
    <line x1="172" y1="218" x2="168" y2="255" stroke="#f4d232" stroke-width="15" stroke-linecap="round"/>
    <!-- torso -->
    <line x1="150" y1="185" x2="156" y2="132" stroke="#f4d232" stroke-width="17" stroke-linecap="round"/>
    <!-- back arm -->
    <line x1="156" y1="138" x2="132" y2="120" stroke="#f4d232" stroke-width="14" stroke-linecap="round"/>
    <line x1="132" y1="120" x2="112" y2="132" stroke="#f4d232" stroke-width="14" stroke-linecap="round"/>
    <!-- front arm, punching forward -->
    <line x1="156" y1="138" x2="188" y2="118" stroke="#f4d232" stroke-width="14" stroke-linecap="round"/>
    <line x1="188" y1="118" x2="224" y2="108" stroke="#f4d232" stroke-width="14" stroke-linecap="round"/>
    <!-- head -->
    <circle cx="152" cy="104" r="26" fill="#f4d232"/>
  </g>

  <!-- Impact spark at the fist -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <line x1="224" y1="108" x2="242" y2="98"/>
    <line x1="224" y1="108" x2="246" y2="112"/>
    <line x1="224" y1="108" x2="238" y2="126"/>
  </g>
</svg>
