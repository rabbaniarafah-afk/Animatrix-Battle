<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1420"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Distant skyline silhouette -->
  <g fill="#121a26">
    <rect x="20" y="430" width="60" height="200"/>
    <rect x="90" y="470" width="45" height="160"/>
    <rect x="150" y="410" width="70" height="220"/>
    <rect x="980" y="440" width="55" height="190"/>
    <rect x="1050" y="480" width="70" height="150"/>
    <rect x="1130" y="400" width="55" height="230"/>
  </g>

  <!-- Ground line -->
  <line x1="0" y1="560" x2="1200" y2="560" stroke="#f4d232" stroke-width="4" opacity="0.6"/>

  <!-- Speed streaks -->
  <line x1="0" y1="120" x2="90" y2="120" stroke="#55b8f6" stroke-width="6" opacity="0.5" stroke-linecap="round"/>
  <line x1="0" y1="150" x2="60" y2="150" stroke="#911df5" stroke-width="6" opacity="0.4" stroke-linecap="round"/>
  <line x1="1120" y1="500" x2="1200" y2="500" stroke="#e8722f" stroke-width="6" opacity="0.4" stroke-linecap="round"/>

  <!-- Two stickmen facing off, right side of the banner -->
  <g filter="url(#glow)">
    <!-- Yellow fighter -->
    <g>
      <line x1="920" y1="460" x2="895" y2="500" stroke="#fbe64d" stroke-width="13" stroke-linecap="round"/>
      <line x1="895" y1="500" x2="902" y2="545" stroke="#fbe64d" stroke-width="13" stroke-linecap="round"/>
      <line x1="920" y1="460" x2="946" y2="502" stroke="#fbe64d" stroke-width="13" stroke-linecap="round"/>
      <line x1="946" y1="502" x2="940" y2="548" stroke="#fbe64d" stroke-width="13" stroke-linecap="round"/>
      <line x1="920" y1="460" x2="926" y2="412" stroke="#fbe64d" stroke-width="15" stroke-linecap="round"/>
      <line x1="926" y1="416" x2="900" y2="398" stroke="#fbe64d" stroke-width="12" stroke-linecap="round"/>
      <line x1="926" y1="416" x2="962" y2="400" stroke="#fbe64d" stroke-width="12" stroke-linecap="round"/>
      <line x1="962" y1="400" x2="994" y2="392" stroke="#fbe64d" stroke-width="12" stroke-linecap="round"/>
      <circle cx="924" cy="388" r="24" fill="#fbe64d"/>
    </g>
    <!-- Blue fighter -->
    <g>
      <line x1="1060" y1="460" x2="1085" y2="500" stroke="#55b8f6" stroke-width="13" stroke-linecap="round"/>
      <line x1="1085" y1="500" x2="1078" y2="545" stroke="#55b8f6" stroke-width="13" stroke-linecap="round"/>
      <line x1="1060" y1="460" x2="1034" y2="502" stroke="#55b8f6" stroke-width="13" stroke-linecap="round"/>
      <line x1="1034" y1="502" x2="1040" y2="548" stroke="#55b8f6" stroke-width="13" stroke-linecap="round"/>
      <line x1="1060" y1="460" x2="1054" y2="412" stroke="#55b8f6" stroke-width="15" stroke-linecap="round"/>
      <line x1="1054" y1="416" x2="1080" y2="398" stroke="#55b8f6" stroke-width="12" stroke-linecap="round"/>
      <circle cx="1056" cy="388" r="24" fill="#55b8f6"/>
    </g>
  </g>

  <!-- Title lockup -->
  <text x="70" y="270" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="88" fill="#ffffff" stroke="#f4d232" stroke-width="3">ANIMATRIX</text>
  <text x="70" y="360" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="88" fill="#f4d232">BATTLE</text>
  <text x="72" y="410" font-family="Arial, sans-serif" font-size="26" letter-spacing="4" fill="#8fa3b8">FIGHT. ANIMATE. DOMINATE.</text>

  <!-- Feature pills -->
  <g font-family="Arial, sans-serif" font-size="20" font-weight="700">
    <rect x="70" y="450" width="180" height="42" rx="21" fill="#141a24" stroke="#2c3444" stroke-width="2"/>
    <text x="90" y="477" fill="#e6edf5">Free to Play</text>

    <rect x="270" y="450" width="230" height="42" rx="21" fill="#141a24" stroke="#2c3444" stroke-width="2"/>
    <text x="290" y="477" fill="#e6edf5">Online Multiplayer</text>

    <rect x="70" y="504" width="200" height="42" rx="21" fill="#141a24" stroke="#2c3444" stroke-width="2"/>
    <text x="90" y="531" fill="#e6edf5">No Download</text>
  </g>
</svg>
